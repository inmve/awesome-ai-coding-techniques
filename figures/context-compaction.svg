<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 150" role="img" aria-label="Compaction: the same session goes on from a summary the agent wrote. Document and Clear: the plan stays in a file, the session is cleared and a new one reads the file"><defs>
<pattern id="h" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#2e2a33" stroke-width="0.7"/></pattern>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#2e2a33" stroke-width="1"/></marker>
</defs>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10.5px;fill:#2e2a33} .m{fill:#8a8490} .r{fill:#d2544a} .g{fill:#3f9a5a}</style><style>.c2{animation:c2 7s infinite}.last{animation:c3 7s infinite}
@keyframes c2{0%,25%{opacity:0}30%,100%{opacity:1}}
@keyframes c3{0%,55%{opacity:0}60%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.c2{animation:none;opacity:1}}@media (prefers-reduced-motion:reduce){.b{animation:none!important;opacity:0!important}.last{animation:none!important;opacity:1!important}}</style><text x="4" y="14" class="m" style="paint-order:stroke;stroke:#fff;stroke-width:3px">Compaction</text><rect x="4" y="22" width="200" height="22" fill="url(#h)" stroke="#2e2a33"/><text x="8" y="37" style="paint-order:stroke;stroke:#fff;stroke-width:3px">180k session</text><g class="c2"><line x1="204" y1="33" x2="236" y2="33" stroke="#2e2a33" marker-end="url(#a)"/><rect x="238" y="22" width="40" height="22" fill="none" stroke="#2e2a33"/><text x="242" y="37" style="paint-order:stroke;stroke:#fff;stroke-width:3px">sum</text><text x="232" y="60" class="m" style="paint-order:stroke;stroke:#fff;stroke-width:3px">written by the agent</text></g><g class="last"><rect x="278" y="22" width="150" height="22" fill="none" stroke="#2e2a33" stroke-dasharray="3 3"/><text x="286" y="37" style="paint-order:stroke;stroke:#fff;stroke-width:3px">same session goes on</text></g><text x="4" y="94" class="m" style="paint-order:stroke;stroke:#fff;stroke-width:3px">Document &amp; Clear</text><rect x="4" y="102" width="200" height="22" fill="url(#h)" stroke="#2e2a33"/><text x="8" y="117" style="paint-order:stroke;stroke:#fff;stroke-width:3px">180k session</text><g class="c2"><line x1="204" y1="113" x2="236" y2="113" stroke="#2e2a33" marker-end="url(#a)"/><rect x="238" y="102" width="62" height="22" fill="none" stroke="#2e2a33"/><text x="242" y="117" style="paint-order:stroke;stroke:#fff;stroke-width:3px">PLAN.md</text><text x="206" y="142" class="m" style="paint-order:stroke;stroke:#fff;stroke-width:3px">file kept, session cleared</text></g><g class="last"><rect x="306" y="102" width="122" height="22" fill="none" stroke="#2e2a33" stroke-width="1.6"/><text x="312" y="117" style="paint-order:stroke;stroke:#fff;stroke-width:3px">new session reads</text></g></svg>
