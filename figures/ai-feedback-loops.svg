<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 130" role="img" aria-label="The agent changes the code, runs build, lint and tests, edits again after a failure and stops when all pass"><defs>
<pattern id="h" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#2e2a33" stroke-width="0.7"/></pattern>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#2e2a33" stroke-width="1"/></marker>
</defs>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10.5px;fill:#2e2a33} .m{fill:#8a8490} .r{fill:#d2544a} .g{fill:#3f9a5a}</style><style>.b2{animation:b2 6s infinite}.b3{animation:b3 6s infinite}.last{animation:b4 6s infinite}
@keyframes b2{0%,15%{opacity:0}20%,45%{opacity:1}50%,100%{opacity:0}}
@keyframes b3{0%,45%{opacity:0}50%,70%{opacity:1}75%,100%{opacity:0}}
@keyframes b4{0%,70%{opacity:0}75%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){.b{animation:none!important;opacity:0!important}.last{animation:none!important;opacity:1!important}}</style><rect x="10" y="46" width="80" height="34" fill="none" stroke="#2e2a33"/><text x="18" y="67.0" style="paint-order:stroke;stroke:#fff;stroke-width:3px">change</text><rect x="152" y="20" width="120" height="86" fill="none" stroke="#2e2a33"/><line x1="90" y1="63" x2="150" y2="63" stroke="#2e2a33" marker-end="url(#a)"/><text x="162" y="42" style="paint-order:stroke;stroke:#fff;stroke-width:3px">build</text><text x="162" y="66" style="paint-order:stroke;stroke:#fff;stroke-width:3px">lint</text><text x="162" y="90" style="paint-order:stroke;stroke:#fff;stroke-width:3px">tests</text><g class="b b2"><text x="250" y="42" class="g" style="paint-order:stroke;stroke:#fff;stroke-width:3px">✓</text><text x="250" y="66" class="g" style="paint-order:stroke;stroke:#fff;stroke-width:3px">✓</text><text x="250" y="90" class="r" style="paint-order:stroke;stroke:#fff;stroke-width:3px">✗</text><text x="290" y="94" class="r" style="paint-order:stroke;stroke:#fff;stroke-width:3px">1 failing</text></g><g class="b b3"><path d="M212 106 V122 H50 V82" fill="none" stroke="#2e2a33" stroke-dasharray="3 3" marker-end="url(#a)"/><text x="96" y="118" class="m" style="paint-order:stroke;stroke:#fff;stroke-width:3px">agent edits again</text></g><g class="last"><text x="250" y="42" class="g" style="paint-order:stroke;stroke:#fff;stroke-width:3px">✓</text><text x="250" y="66" class="g" style="paint-order:stroke;stroke:#fff;stroke-width:3px">✓</text><text x="250" y="90" class="g" style="paint-order:stroke;stroke:#fff;stroke-width:3px">✓</text><line x1="272" y1="63" x2="340" y2="63" stroke="#2e2a33" marker-end="url(#a)"/><text x="346" y="67" class="g" style="paint-order:stroke;stroke:#fff;stroke-width:3px">done</text></g></svg>
