<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 130" role="img" aria-label="Tests are data files read by a small runner, so a change to an expected value is visible in the diff"><defs>
<pattern id="h" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#2e2a33" stroke-width="0.7"/></pattern>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#2e2a33" stroke-width="1"/></marker>
</defs>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10.5px;fill:#2e2a33} .m{fill:#8a8490} .r{fill:#d2544a} .g{fill:#3f9a5a}</style><path d="M10 10 h140 l10 10 v90 h-150 z M150 10 v10 h10" fill="#fff" stroke="#2e2a33"/><text x="18" y="26" style="paint-order:stroke;stroke:#fff;stroke-width:3px">cases/vat.yaml</text><text x="18" y="42" style="paint-order:stroke;stroke:#fff;stroke-width:3px">input: 100</text><rect x="14" y="50" width="136" height="16" fill="url(#h)" stroke="#2e2a33"/><text x="18" y="62" class="r" style="paint-order:stroke;stroke:#fff;stroke-width:3px">expect: 120 → 119</text><text x="18" y="90" class="m" style="paint-order:stroke;stroke:#fff;stroke-width:3px">+ 40 more cases</text><line x1="160" y1="60" x2="220" y2="60" stroke="#2e2a33" marker-end="url(#a)"/><rect x="222" y="40" width="90" height="40" fill="none" stroke="#2e2a33"/><text x="230" y="64.0" style="paint-order:stroke;stroke:#fff;stroke-width:3px">runner</text><line x1="312" y1="60" x2="360" y2="60" stroke="#2e2a33" marker-end="url(#a)"/><text x="364" y="64" class="r" style="paint-order:stroke;stroke:#fff;stroke-width:3px">diff ⚑</text></svg>
