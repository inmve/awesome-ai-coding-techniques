<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 120" role="img" aria-label="A fault is injected into the code; a good test fails, a weak one still passes"><defs>
<pattern id="h" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#2e2a33" stroke-width="0.7"/></pattern>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#2e2a33" stroke-width="1"/></marker>
</defs>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10.5px;fill:#2e2a33} .m{fill:#8a8490} .r{fill:#d2544a} .g{fill:#3f9a5a}</style><rect x="10" y="20" width="150" height="40" fill="none" stroke="#2e2a33"/><text x="18" y="44" class="r" style="paint-order:stroke;stroke:#fff;stroke-width:3px">a + b  →  a - b</text><text x="18" y="80" class="m" style="paint-order:stroke;stroke:#fff;stroke-width:3px">mutant</text><line x1="160" y1="40" x2="220" y2="26" stroke="#2e2a33" marker-end="url(#a)"/><line x1="160" y1="40" x2="220" y2="82" stroke="#2e2a33" marker-end="url(#a)"/><rect x="222" y="10" width="140" height="30" fill="none" stroke="#2e2a33"/><text x="230" y="30" style="paint-order:stroke;stroke:#fff;stroke-width:3px">test_sum  fails</text><text x="370" y="30" class="g" style="paint-order:stroke;stroke:#fff;stroke-width:3px">✓</text><rect x="222" y="66" width="140" height="30" fill="url(#h)" stroke="#2e2a33"/><text x="230" y="86" style="paint-order:stroke;stroke:#fff;stroke-width:3px">test_total passes</text><text x="370" y="86" class="r" style="paint-order:stroke;stroke:#fff;stroke-width:3px">✗</text><text x="386" y="86" class="m" style="paint-order:stroke;stroke:#fff;stroke-width:3px">weak</text></svg>
