<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#2e2a33" stroke-width="1"/></marker>
</defs>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10.5px;fill:#2e2a33} .m{fill:#8a8490} .r{fill:#d2544a} .g{fill:#3f9a5a}</style><rect x="10" y="44" width="80" height="34" fill="none" stroke="#2e2a33"/><text x="18" y="65.0" style="paint-order:stroke;stroke:#fff;stroke-width:3px">change</text><line x1="90" y1="61" x2="140" y2="61" stroke="#2e2a33" marker-end="url(#a)"/><rect x="142" y="48" width="40" height="26" fill="none" stroke="#2e2a33"/><circle cx="170" cy="61" r="8" fill="#2f5f8f"/><text x="140" y="42" class="m" style="paint-order:stroke;stroke:#fff;stroke-width:3px">flag</text><line x1="182" y1="61" x2="226" y2="61" stroke="#2e2a33" marker-end="url(#a)"/><text x="230" y="65" style="paint-order:stroke;stroke:#fff;stroke-width:3px">5%</text><line x1="258" y1="61" x2="290" y2="61" stroke="#2e2a33" marker-end="url(#a)"/><text x="294" y="65" style="paint-order:stroke;stroke:#fff;stroke-width:3px">25%</text><line x1="330" y1="61" x2="362" y2="61" stroke="#2e2a33" marker-end="url(#a)"/><text x="366" y="65" style="paint-order:stroke;stroke:#fff;stroke-width:3px">100%</text><path d="M300 74 V108 H50 V80" fill="none" stroke="#2e2a33" stroke-dasharray="3 3" marker-end="url(#a)"/><text x="130" y="122" class="m" style="paint-order:stroke;stroke:#fff;stroke-width:3px">error rate, latency</text></svg>
